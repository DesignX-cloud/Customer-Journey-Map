<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客戶旅程流程｜新人教育訓練</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="assets/css/style.css" rel="stylesheet">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <header class="mb-5">
      <p class="page-eyebrow mb-2">新人教育訓練</p>
      <h1 class="fw-bold mb-3">客戶旅程流程</h1>
      <p class="text-secondary mb-0">從需求產生到關係維護，認識客戶旅程的 12 個階段。</p>
    </header>
    <section class="journey-section p-3 p-md-4" aria-labelledby="stages-heading">
      <h2 id="stages-heading" class="h5 fw-bold mb-2">12 階段總覽</h2>
      <p class="text-secondary small mb-4">目前開放第 03 階段「諮詢」與第 04 階段「約訪」，其餘階段建置中。</p>
      <nav class="journey-scroll" aria-label="客戶旅程階段" tabindex="0">
        <ol class="journey-grid list-unstyled mb-0">
          <li><button class="stage-card" type="button" disabled><span class="stage-number">01</span><span class="stage-name">需求產生</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">02</span><span class="stage-name">品牌認知與接觸</span><span class="stage-status">建置中</span></button></li>
          <li><a class="stage-card stage-card-active" href="stages/03-consultation/index.html"><span class="stage-number">03</span><span class="stage-name">諮詢</span><span class="stage-status">進入階段 →</span></a></li>
          <li><a class="stage-card stage-card-active" href="stages/04-visit/index.html"><span class="stage-number">04</span><span class="stage-name">約訪</span><span class="stage-status">進入階段 →</span></a></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">05</span><span class="stage-name">簽約</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">06</span><span class="stage-name">付款</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">07</span><span class="stage-name">服務準備</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">08</span><span class="stage-name">首次服務與期待驗證</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">09</span><span class="stage-name">服務磨合與調整</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">10</span><span class="stage-name">定期服務與關係維護</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">11</span><span class="stage-name">續約評估與決策</span><span class="stage-status">建置中</span></button></li>
          <li><button class="stage-card" type="button" disabled><span class="stage-number">12</span><span class="stage-name">解約與流失</span><span class="stage-status">建置中</span></button></li>
        </ol>
      </nav>
    </section>
  </main>
</body>
</html>
