<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 簽約階段｜客戶旅程流程</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <script src="../../assets/js/main.js?v=contract-title-source-20261105-4" defer></script>
</head>
<body>
  <main class="container py-5">
    <a class="btn back-link mb-4 px-4" href="../../index.html">← 返回首頁</a>
    <header class="mb-4">
      <p class="page-eyebrow mb-2">客戶旅程流程</p>
      <h1 class="fw-bold">05 簽約階段</h1>
    </header>
    <div class="flowchart-toolbar d-flex flex-wrap align-items-center gap-2 mb-3" role="group" aria-label="流程圖縮放控制">
      <button class="btn btn-outline-secondary" type="button" data-flow-zoom="out" aria-controls="contract-flowchart" disabled>− 縮小</button>
      <button class="btn btn-outline-secondary" type="button" data-flow-zoom="in" aria-controls="contract-flowchart" disabled>＋ 放大</button>
      <button class="btn btn-outline-secondary" type="button" data-flow-zoom="reset" aria-controls="contract-flowchart" disabled>重置</button>
      <output id="flowchart-scale" class="small ms-2" aria-live="polite"></output>
    </div>
    <aside class="alert alert-danger flowchart-help mb-3" aria-labelledby="flowchart-help-title">
      <div class="d-flex flex-column flex-md-row align-items-start gap-1 gap-md-3">
        <h2 id="flowchart-help-title" class="h6 fw-bold mb-0 flex-shrink-0">操作提示</h2>
        <div class="d-flex flex-wrap column-gap-3 row-gap-1">
          <p class="mb-0">節點右上角出現 <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i><span class="visually-hidden">外部連結</span> 圖示，表示可查看延伸教材。滑鼠移入時，節點會呈現淡紫色，點擊即可開啟教材。</p>
          <p class="mb-0">可使用上方按鈕縮放流程圖；放大後可水平及垂直捲動。</p>
        </div>
      </div>
      <p id="flowchart-status" class="small mt-1 mb-0" role="status">正在載入教材資料…</p>
    </aside>
    <section class="flowchart-container" aria-label="簽約階段流程圖，可水平與垂直捲動" tabindex="0">
      <div class="flowchart-surface contract-surface">
      <div id="contract-flowchart" class="flow-canvas contract-canvas" data-flow-canvas data-width="2400" data-height="1505" data-node-count="14" data-nodes="./nodes.json" aria-label="05 簽約階段流程圖">
        <nav class="flow-stage-nav flow-stage-nav--overlay" aria-label="流程圖原始 12 階段總覽"><ol>
          <li style="left:1460px;top:53px;">1. 需求產生</li>
          <li style="left:1611px;top:53px;">2. 品牌認知與接觸</li>
          <li style="left:1762px;top:53px;">3. 諮詢</li>
          <li style="left:1913px;top:53px;">4. 約訪</li>
          <li style="left:2064px;top:53px;" aria-current="step">5. 簽約</li>
          <li style="left:2215px;top:53px;">6. 付款</li>
          <li style="left:1460px;top:131px;">7. 服務準備</li>
          <li style="left:1611px;top:131px;">8. 首次服務與期待驗證</li>
          <li style="left:1762px;top:131px;">9. 服務磨合與調整</li>
          <li style="left:1913px;top:131px;">10. 定期服務與關係維護</li>
          <li style="left:2064px;top:131px;">11. 續約評估與決策</li>
          <li style="left:2215px;top:131px;">12. 解約與流失</li>
        </ol></nav>
        <img class="contract-diagram" src="./flowchart.svg" width="2400" height="1505" alt="05 簽約階段完整泳道流程圖，包含客戶、駐點／內勤專員、例外／中斷及底部 F10 數據與衡量指標、F11 資料來源與驗證方式。">
        <div id="contract-001" class="contract-node" data-flow-node aria-label="確認合約內容；說明付款、服務與解約條件" style="left:70px;top:545px;width:280px;height:100px;"></div>
        <div id="contract-002" class="contract-node" data-flow-node aria-label="閱讀並確認合約；了解雙方權利與義務" style="left:70px;top:282px;width:280px;height:100px;"></div>
        <div id="contract-003" class="contract-node contract-decision" data-flow-node aria-label="是否同意條款；並繼續簽約？" style="left:390px;top:252px;width:260px;height:160px;"></div>
        <div id="contract-004" class="contract-node" data-flow-node aria-label="透過 Email；提供電子合約簽署" style="left:770px;top:545px;width:260px;height:100px;"></div>
        <div id="contract-005" class="contract-node" data-flow-node aria-label="開啟電子合約；依流程完成簽署" style="left:1110px;top:280px;width:280px;height:100px;"></div>
        <div id="contract-006" class="contract-node contract-decision" data-flow-node aria-label="是否順利；完成簽署？" style="left:1400px;top:515px;width:260px;height:160px;"></div>
        <div id="contract-007" class="contract-node" data-flow-node aria-label="確認簽署狀態；確認付款安排" style="left:1780px;top:545px;width:280px;height:100px;"></div>
        <div id="contract-008" class="contract-node" data-flow-node aria-label="確認已完成簽署；確認後續付款安排" style="left:1780px;top:282px;width:280px;height:100px;"></div>
        <div id="contract-009" class="contract-node" data-flow-node aria-label="進入階段 6｜付款" style="left:2160px;top:545px;width:205px;height:100px;"></div>
        <div id="contract-010" class="contract-node" data-flow-node aria-label="客戶不熟悉電子簽約操作；無法順利完成簽署；操作協助與後續處理：待確認" style="left:1230px;top:820px;width:600px;height:160px;"></div>
        <div id="contract-011" class="contract-node" data-flow-node aria-label="客戶反悔／家人反對／條款疑慮 → 簽約中止" style="left:90px;top:1200px;width:910px;height:76px;"></div>
        <div id="contract-012" class="contract-node" data-flow-node aria-label="電子簽約操作卡關 → 尚未完成簽署；是否後續完成或取消，待確認" style="left:1180px;top:1200px;width:1150px;height:76px;"></div>
        <div id="contract-013" class="contract-node contract-info" data-flow-node aria-label="簽約疑慮與阻礙｜F7、F8；客戶臨時反悔：無法試做、對解約條件有疑慮；家人臨時反對：不喜歡陌生人在家；常常不在家：不放心陌生人獨自在家清掃；可能結果：簽約中止，需記錄原因。" style="left:70px;top:790px;width:930px;height:250px;"></div>
        <div id="contract-014" class="contract-node contract-info" data-flow-node aria-label="公司現行應對｜F9；待確認；未將建議措施列為現行流程。" style="left:1880px;top:820px;width:450px;height:160px;"></div>
      </div>
      </div>
    </section>
  </main>
